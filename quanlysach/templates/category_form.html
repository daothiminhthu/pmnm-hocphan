{% extends "base.html" %}
{% block title %}{{ 'Sửa' if category else 'Thêm' }} danh mục · Quản lý sách{% endblock %}
{% block content %}
<h1>{{ 'Sửa danh mục' if category else 'Thêm danh mục' }}</h1>
<form method="post" class="form panel">
  <label>Tên danh mục
    <input name="name" value="{{ form.get('name', '') }}" required autofocus>
  </label>
  <label>Mô tả
    <textarea name="description" rows="3">{{ form.get('description', '') }}</textarea>
  </label>
  <div class="form-actions">
    <button class="btn primary">Lưu danh mục</button>
    <a href="{{ url_for('categories') }}">Huỷ</a>
  </div>
</form>
{% endblock %}
