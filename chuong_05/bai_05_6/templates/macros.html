
{% macro render_field(field) %}
<div class="form-group">
    {{ field.label }}

    {{ field(
        class="form-control",
        placeholder=field.label.text
    ) }}

    {% if field.errors %}
        <div class="field-errors">
            {% for error in field.errors %}
                <span>{{ error }}</span>
            {% endfor %}
        </div>
    {% endif %}
</div>
{% endmacro %}
