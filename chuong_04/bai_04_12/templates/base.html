<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6fb;
            color: #263238;
        }

        .navbar {
            background: white;
            box-shadow: 0 2px 10px #0000000d;
        }

        .navbar-brand {
            color: #2457c5;
            font-weight: 700;
        }

        .nav-link {
            color: #596579;
            margin: 0 4px;
            border-radius: 8px;
        }

        .nav-link:hover {
            background: #eef3ff;
            color: #2457c5;
        }

        .nav-link.active {
            background: #2457c5;
            color: white;
        }

        .content-box {
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 4px 18px #00000008;
            min-height: 230px;
        }

        footer {
            color: #778195;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-sm">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                {{ site_name }}
            </a>

            <div class="navbar-nav ms-auto">
                {% from "_macros.html" import render_menu with context %}
                {{ render_menu(menu) }}
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="content-box">
            {% block content %}{% endblock %}

            <hr class="my-4">

            <p class="text-secondary mb-1">
                Endpoint hiện tại: <code>{{ request.endpoint }}</code>
            </p>
            <p class="text-secondary mb-0">
                Đường dẫn hiện tại: <code>{{ request.path }}</code>
            </p>
        </div>
    </main>

    <footer class="text-center pb-4">
        © {{ current_year }} {{ site_name }}
    </footer>
</body>
</html>
