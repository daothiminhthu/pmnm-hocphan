
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Trang cá nhân{% endblock %} | {{ ho_ten }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    {% block head %}{% endblock %}

    <style>
        body {
            background: #f5f7fb;
            color: #273247;
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: .3px;
        }

        .hero {
            background: linear-gradient(135deg, #5266d8, #8196f0);
            color: white;
            border-radius: 18px;
            padding: 38px 30px;
        }

        .content-card {
            background: white;
            border: 1px solid #e9edf5;
            border-radius: 14px;
            padding: 24px;
            height: 100%;
        }

        .section-title {
            font-weight: 700;
            margin-bottom: 18px;
        }

        footer {
            color: #8791a5;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand text-primary" href="{{ url_for('trang_chu') }}">
                MyPortfolio
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('trang_chu') }}">
                            Giới thiệu
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('hoc_van') }}">
                            Học vấn
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('trang_du_an') }}">
                            Dự án
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('lien_he') }}">
                            Liên hệ
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4 py-md-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="container text-center py-4 border-top">
        © 2026 {{ ho_ten }} · Website cá nhân Flask & Jinja2
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
